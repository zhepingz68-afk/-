<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENERGY BATTLE</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#191923; color:#eee; }
    header { padding:18px 24px 8px; text-align:center; }
    h1 { margin:0; color:#ffdc46; font-size:clamp(32px,6vw,54px); letter-spacing:.03em; }
    .credit { margin-top:4px; color:#aaa; font-size:14px; }
    .layout { display:grid; grid-template-columns:minmax(640px, 1fr) 320px; gap:18px; max-width:1180px; margin:0 auto; padding:12px 18px 28px; align-items:start; }
    .game-wrap { background:#20202b; border:1px solid #4f4f60; padding:10px; border-radius:12px; }
    canvas { display:block; width:100%; height:auto; background:#1e1e27; border-radius:8px; image-rendering:auto; }
    .panel { background:#20202b; border:1px solid #4f4f60; border-radius:12px; padding:16px; }
    .panel h2 { margin:0 0 12px; color:#ffdc46; font-size:24px; }
    .stats { width:100%; border-collapse:collapse; font-size:14px; }
    .stats th,.stats td { padding:8px 6px; border-bottom:1px solid #444452; text-align:right; }
    .stats th:first-child,.stats td:first-child { text-align:left; }
    .small { color:#aaa; font-size:12px; line-height:1.5; }
    .status { min-height:20px; margin-top:10px; font-size:13px; color:#9fd0ff; }
    @media (max-width: 940px) {
      .layout { grid-template-columns:1fr; }
      .game-wrap { order:0; }
      .panel { order:1; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./stats.js"></script>
</head>
<body>
  <header>
    <h1>ENERGY BATTLE</h1>
    <div class="credit">このゲームはChatGPTのサポートで制作しました。</div>
  </header>

  <main class="layout">
    <section class="game-wrap">
      <canvas id="game" width="800" height="500" aria-label="ENERGY BATTLE ゲーム画面"></canvas>
    </section>

    <aside class="panel">
      <h2>プレイ統計</h2>
      <table class="stats">
        <thead>
          <tr>
            <th>難易度</th>
            <th>プレイ人数*</th>
            <th>勝利</th>
            <th>敗北</th>
          </tr>
        </thead>
        <tbody id="statsBody">
          <tr><td>かんたん</td><td>-</td><td>-</td><td>-</td></tr>
          <tr><td>ふつう</td><td>-</td><td>-</td><td>-</td></tr>
          <tr><td>むずかしい</td><td>-</td><td>-</td><td>-</td></tr>
          <tr><td>鬼</td><td>-</td><td>-</td><td>-</td></tr>
        </tbody>
      </table>
      <div class="small">* プレイ人数は、匿名のブラウザIDを使った推定値です。同じ人が別の端末やブラウザで遊ぶと別人として数えられることがあります。</div>
      <div id="statsStatus" class="status">統計を準備中…</div>
    </aside>
  </main>

  <script src="./game.js"></script>
</body>
</html>
